[package]
name = "shellcanvas-adapter-sdk"
version = "0.1.4"
edition = "2021"
license = "MPL-2.0"
description = "Versioned process protocol and concurrent server for ShellCanvas connection adapters"
readme = "README.md"
repository = "https://github.com/techartdev/ShellCanvas"
homepage = "https://shellcanvas.com/docs/adapter-sdk/quickstart.html"
documentation = "https://docs.rs/shellcanvas-adapter-sdk"
keywords = ["shellcanvas", "adapter", "remote", "device", "protocol"]
categories = ["api-bindings", "asynchronous"]
rust-version = "1.93"

[dependencies]
anyhow = "1"
semver = "1"
sha2 = "0.10"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "io-std", "sync", "time", "rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"
