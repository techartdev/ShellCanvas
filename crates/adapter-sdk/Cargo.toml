[package]
name = "shellcanvas-adapter-sdk"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Versioned process protocol and concurrent server for ShellCanvas connection adapters"
readme = "README.md"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "io-std", "sync", "time", "rt-multi-thread", "macros"] }
