[package]
name = "shellcanvas-core"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[dependencies]
anyhow = "1"
async-trait = "0.1"
dirs = "6"
russh = { version = "0.63.2", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.4.0"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util"] }

[dev-dependencies]
tempfile = "3"
