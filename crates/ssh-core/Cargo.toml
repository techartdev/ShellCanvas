[package]
name = "shellcanvas-core"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[dependencies]
shellcanvas-services = { path = "../service-contracts" }
anyhow = "1"
async-trait = "0.1"
dirs = "6"
russh = { version = "0.63.2", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.13"
sha1 = "0.11"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["process", "test-util"] }
shellcanvas-filesystem-sdk = { path = "../filesystem-sdk" }
tempfile = "3"
rand = "0.10"
