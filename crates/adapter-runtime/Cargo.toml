[package]
name = "shellcanvas-adapter-runtime"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[dependencies]
shellcanvas-adapter-sdk = { version = "0.1.0", path = "../adapter-sdk" }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
semver = "1"
uuid = { version = "1", features = ["v4"] }
shellcanvas-services = { path = "../service-contracts" }
tokio = { version = "1", features = ["process", "io-util", "io-std", "sync", "time", "rt-multi-thread", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[[bin]]
name = "fixture-adapter"
path = "tests/support/fixture_adapter.rs"
test = false

[[bin]]
name = "sdk-adapter"
path = "../adapter-sdk/examples/echo.rs"
test = false

[[bin]]
name = "sdk-files"
path = "../adapter-sdk/examples/files.rs"
test = false

[[bin]]
name = "sdk-console"
path = "../adapter-sdk/examples/console.rs"
test = false

[[bin]]
name = "sdk-settings"
path = "../adapter-sdk/examples/settings.rs"
test = false

[[bin]]
name = "catalog-review-fixture"
path = "tests/support/catalog_review_fixture.rs"
test = false
