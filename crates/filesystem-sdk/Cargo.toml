[package]
name = "shellcanvas-filesystem-sdk"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Optional filesystem handles and native bridge protocol for ShellCanvas"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "sync", "rt", "time"] }
