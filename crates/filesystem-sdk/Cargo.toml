[package]
name = "shellcanvas-filesystem-sdk"
version = "0.1.5"
edition = "2021"
license = "MPL-2.0"
description = "Optional filesystem handles and native bridge protocol for ShellCanvas"
readme = "README.md"
repository = "https://github.com/techartdev/ShellCanvas"
homepage = "https://shellcanvas.com/docs/adapter-sdk/filesystem.html"
documentation = "https://docs.rs/shellcanvas-filesystem-sdk"
keywords = ["shellcanvas", "filesystem", "remote", "mount", "sdk"]
categories = ["api-bindings", "filesystem"]
rust-version = "1.93"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "sync", "rt", "time"] }
