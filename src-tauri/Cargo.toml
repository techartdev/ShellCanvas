[package]
name = "shellcanvas"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[lib]
name = "shellcanvas_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
shellcanvas-core = { path = "../crates/ssh-core" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "time"] }
