name: Publish SDKs

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.version }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run release:check -- "${{ inputs.version }}"
      - run: npm test --workspace @techartdev/shellcanvas-app-sdk
      - run: npm publish --workspace @techartdev/shellcanvas-app-sdk --access public

  crates:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.version }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm run release:check -- "${{ inputs.version }}"
      - run: cargo test -p shellcanvas-filesystem-sdk -p shellcanvas-adapter-sdk --locked
      - run: cargo publish -p shellcanvas-filesystem-sdk --locked
      - run: cargo publish -p shellcanvas-adapter-sdk --locked
